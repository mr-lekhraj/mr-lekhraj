<g fill="none" stroke="#b9a878" stroke-opacity=".35" stroke-width="2"><path d="M100 70 H1436"/><path d="M100 490 H1436"/></g>
<text x="768" y="112" text-anchor="middle" fill="#66746a" font-family="Arial,sans-serif" font-size="19" letter-spacing="7">01  /  THE PERSON BEHIND THE PROJECTS</text>
<text x="768" y="222" text-anchor="middle" fill="#17372e" font-family="Georgia,serif" font-size="63" font-weight="bold">Curious by research.</text>
<text x="768" y="294" text-anchor="middle" fill="#17372e" font-family="Georgia,serif" font-size="63" font-weight="bold">Practical by design.</text>
<text x="768" y="374" text-anchor="middle" fill="#43564d" font-family="Arial,sans-serif" font-size="25">I’m Lekh Raj, a Zoology research scholar and builder of useful digital products.</text>
<text x="768" y="416" text-anchor="middle" fill="#43564d" font-family="Arial,sans-serif" font-size="25">I bring an academic mindset to creating accessible tools and practical resources.</text>
<text x="768" y="464" text-anchor="middle" fill="#8a805e" font-family="Georgia,serif" font-size="25" font-style="italic">“Turning complex tasks into clear, usable tools.”</text>

</svg>